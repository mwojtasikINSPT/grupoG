spring.application.name=policia-backend

# ==========================================
# BASE DE DATOS
# ==========================================

# URL de conexi\u00f3n a MySQL
spring.datasource.url=${DB_URL}
# Usuario de MySQL
spring.datasource.username=${DB_USERNAME}
# Contrase\u00f1a de MySQL
spring.datasource.password=${DB_PASSWORD}

spring.config.import=optional:classpath:application-local.properties

app.datos.inicializar=true

# Adjunto opcional: 2 MiB exactos. Margen para campos y cabeceras multipart.
app.pruebas.archivo.max-size=2097152B
spring.servlet.multipart.max-file-size=${app.pruebas.archivo.max-size}
spring.servlet.multipart.max-request-size=3MB
# Mantiene las partes admitidas en memoria, sin almacenar adjuntos en disco.
spring.servlet.multipart.file-size-threshold=${spring.servlet.multipart.max-request-size}
# Resolver antes del enlace de campos para normalizar los errores multipart.
spring.servlet.multipart.resolve-lazily=false
# Descarta el resto del envio y permite entregar el error 413 al cliente.
server.tomcat.max-swallow-size=-1

# ==========================================
# JPA / HIBERNATE
# ==========================================

#spring.jpa.hibernate.ddl-auto=create
# Actualiza las tablas seg\u00fan las entidades Java
spring.jpa.hibernate.ddl-auto=update
# Muestra las consultas SQL en consola
spring.jpa.show-sql=true
# Formatea las consultas SQL para que sean legibles
spring.jpa.properties.hibernate.format_sql=true


# ==========================================
# CONFIGURACION CORS (FRONTEND)
# ==========================================

# Origen permitido para las peticiones HTTP desde el frontend (Vaadin)
cors.allowed-origin=http://localhost:8081


logging.level.org.springframework.security=INFO
