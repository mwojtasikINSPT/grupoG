vaadin.launch-browser=true
spring.application.name=policia-frontend
server.port=8081
backend.url=${BACKEND_URL:http://localhost:8080/api}

# Tiempo m\u00e1ximo de inactividad antes de que expire la sesi\u00f3n (5 minutos).
server.servlet.session.timeout=5m

# Oculta las herramientas flotantes de desarrollo de Vaadin.
vaadin.devmode.devTools.enabled=false
vaadin.copilot.enable=false
